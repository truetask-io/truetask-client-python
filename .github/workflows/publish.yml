# A tag publishes the package to PyPI. Nothing here holds a token.
#
# PyPI authenticates the workflow itself through OIDC (trusted publishing),
# so the only setup is once, on PyPI: Publishing -> add a pending publisher
# with owner truetask-io, repository truetask-client-python, workflow
# publish.yml, environment pypi.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A version goes out once and PyPI never lets it be reused, so the tag has
# to agree with truetask_db.__version__ before anything is built.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag says what the package says
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(python -c 'import truetask_db; print(truetask_db.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag but truetask_db.__version__ is $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - run: python -m pip install --upgrade build twine

      - run: python -m build

      - run: python -m twine check --strict dist/*

      # The whole matrix, 3.7 to 3.14, is test.yml's job on every push; this
      # is the last look before an upload that can never be taken back.
      - name: The tests pass
        run: |
          python -W error -m unittest discover -s tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

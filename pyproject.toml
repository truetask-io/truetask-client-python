[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "truetask-db"
description = "Read and write a Truetask database from Python, the way the PocketBase SDK does."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Truetask" }]
# The Python a DCC ships (mayapy, Nuke's, hython) is the oldest this has to
# run in, so: the standard library, and nothing newer than 3.7 says.
requires-python = ">=3.7"
dependencies = []
dynamic = ["version"]
keywords = ["truetask", "database", "api", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/truetask-io/truetask-client-python"
Source = "https://github.com/truetask-io/truetask-client-python"
Issues = "https://github.com/truetask-io/truetask-client-python/issues"
Changelog = "https://github.com/truetask-io/truetask-client-python/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["truetask_db"]

[tool.setuptools.dynamic]
version = { attr = "truetask_db.__version__" }
